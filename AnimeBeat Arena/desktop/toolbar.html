<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeBeat Live Hub</title>
    <style>
      :root {
        --bg: #070b19;
        --panel: #0d1430;
        --border: rgba(130, 154, 255, 0.32);
        --text: #f3f6ff;
        --muted: #b6c0db;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Segoe UI, sans-serif;
      }
      .toolbar {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 12px;
        background: linear-gradient(180deg, #101a3b 0%, #0a122d 100%);
        border-bottom: 1px solid var(--border);
        box-sizing: border-box;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .selectors {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-right: 6px;
      }
      .selectors label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
      }
      button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #18234d;
      }
      .primary {
        border: none;
        background: linear-gradient(120deg, #6e46ff, #14b8ff);
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div>
        <div class="title">AnimeBeat Live Hub</div>
        <div class="hint">Ctrl+1..4: vues · Ctrl+5: split · Ctrl+6: 4 ecrans · Ctrl+7: ecrans choisis · Ctrl+8: site · Ctrl+F: plein ecran</div>
      </div>
      <div class="actions">
        <div class="selectors">
          <label><input type="checkbox" value="0" checked /> Live 1</label>
          <label><input type="checkbox" value="1" checked /> Live 2</label>
          <label><input type="checkbox" value="2" checked /> Kick</label>
          <label><input type="checkbox" value="3" checked /> Twitch</label>
        </div>
        <button data-action="apply-selection">Appliquer ecrans</button>
        <button data-action="toggle-fullscreen">Plein ecran</button>
        <button data-mode="site">Site complet</button>
        <button class="primary" data-mode="tab-1">Live 1</button>
        <button data-mode="tab-2">Live 2</button>
        <button data-mode="tab-3">Kick</button>
        <button data-mode="tab-4">Twitch</button>
        <button data-mode="split">Split</button>
        <button data-mode="quad">4 ecrans</button>
        <button data-mode="custom-grid">Ecrans choisis</button>
      </div>
    </div>
    <script>
      function getSelectedIndexes() {
        const selected = Array.from(document.querySelectorAll(".selectors input:checked")).map((el) =>
          Number(el.value),
        );
        return selected.length > 0 ? selected : [0];
      }

      document.querySelectorAll("[data-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          window.liveHub.setMode(btn.getAttribute("data-mode"));
        });
      });

      document.querySelector('[data-action="apply-selection"]').addEventListener("click", () => {
        window.liveHub.setSelection(getSelectedIndexes());
      });

      document.querySelector('[data-action="toggle-fullscreen"]').addEventListener("click", () => {
        window.liveHub.toggleFullScreen();
      });
    </script>
  </body>
</html>
