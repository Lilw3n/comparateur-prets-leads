<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeBeat Live Hub</title>
    <style>
      :root {
        --bg: #070b19;
        --panel: #0d1430;
        --border: rgba(130, 154, 255, 0.32);
        --text: #f3f6ff;
        --muted: #b6c0db;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Segoe UI, sans-serif;
      }
      .toolbar {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 12px;
        background: linear-gradient(180deg, #101a3b 0%, #0a122d 100%);
        border-bottom: 1px solid var(--border);
        box-sizing: border-box;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .screen-count {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .slot-configs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .slot {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 6px;
        background: #0d1430;
      }
      .source-powers {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .source-power {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 6px;
        background: #0d1430;
      }
      .slot label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
      }
      .source-power .name {
        font-size: 11px;
        color: var(--muted);
      }
      .chat-controls {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 6px;
        background: #0d1430;
      }
      select {
        border: 1px solid var(--border);
        background: #111a3d;
        color: var(--text);
        border-radius: 6px;
        padding: 5px 6px;
        font-size: 12px;
      }
      button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #18234d;
      }
      .primary {
        border: none;
        background: linear-gradient(120deg, #6e46ff, #14b8ff);
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div>
        <div class="title">AnimeBeat Live Hub</div>
        <div class="hint">Ctrl+2..4: nombre d'ecrans · Ctrl+C: chat · Ctrl+F: plein ecran</div>
      </div>
      <div class="actions">
        <div class="screen-count">
          <button data-count="2">2 ecrans</button>
          <button data-count="3">3 ecrans</button>
          <button data-count="4">4 ecrans</button>
        </div>
        <div class="source-powers">
          <div class="source-power">
            <span class="name">Live 1</span>
            <button data-source-id="live-1" data-source-power="on">Éteindre</button>
          </div>
          <div class="source-power">
            <span class="name">Live 2</span>
            <button data-source-id="live-2" data-source-power="on">Éteindre</button>
          </div>
          <div class="source-power">
            <span class="name">Kick</span>
            <button data-source-id="kick" data-source-power="on">Éteindre</button>
          </div>
          <div class="source-power">
            <span class="name">Twitch</span>
            <button data-source-id="twitch" data-source-power="on">Éteindre</button>
          </div>
        </div>
        <div class="slot-configs">
          <div class="slot" data-slot="0">
            <label>E1</label>
            <select data-slot-source="0">
              <option value="live-1">Live 1</option>
              <option value="live-2">Live 2</option>
              <option value="kick">Kick</option>
              <option value="twitch">Twitch</option>
              <option value="site">Site</option>
            </select>
            <button data-slot-mode="live" data-slot-index="0">Live</button>
            <button data-slot-mode="live-fs" data-slot-index="0">Live plein écran</button>
            <button data-slot-mode="site" data-slot-index="0">Site</button>
          </div>
          <div class="slot" data-slot="1">
            <label>E2</label>
            <select data-slot-source="1">
              <option value="live-1">Live 1</option>
              <option value="live-2">Live 2</option>
              <option value="kick">Kick</option>
              <option value="twitch">Twitch</option>
              <option value="site">Site</option>
            </select>
            <button data-slot-mode="live" data-slot-index="1">Live</button>
            <button data-slot-mode="live-fs" data-slot-index="1">Live plein écran</button>
            <button data-slot-mode="site" data-slot-index="1">Site</button>
          </div>
          <div class="slot" data-slot="2">
            <label>E3</label>
            <select data-slot-source="2">
              <option value="live-1">Live 1</option>
              <option value="live-2">Live 2</option>
              <option value="kick">Kick</option>
              <option value="twitch">Twitch</option>
              <option value="site">Site</option>
            </select>
            <button data-slot-mode="live" data-slot-index="2">Live</button>
            <button data-slot-mode="live-fs" data-slot-index="2">Live plein écran</button>
            <button data-slot-mode="site" data-slot-index="2">Site</button>
          </div>
          <div class="slot" data-slot="3">
            <label>E4</label>
            <select data-slot-source="3">
              <option value="live-1">Live 1</option>
              <option value="live-2">Live 2</option>
              <option value="kick">Kick</option>
              <option value="twitch">Twitch</option>
              <option value="site">Site</option>
            </select>
            <button data-slot-mode="live" data-slot-index="3">Live</button>
            <button data-slot-mode="live-fs" data-slot-index="3">Live plein écran</button>
            <button data-slot-mode="site" data-slot-index="3">Site</button>
          </div>
        </div>
        <div class="chat-controls">
          <button data-chat-toggle="on" class="primary">Chat ON</button>
          <select data-chat-mode>
            <option value="mix">Chat Mix</option>
            <option value="kick">Chat Kick</option>
            <option value="twitch">Chat Twitch</option>
            <option value="tiktok">Chat TikTok</option>
          </select>
        </div>
        <button class="primary" data-action="toggle-fullscreen">Plein ecran</button>
      </div>
    </div>
    <script>
      function updatePowerButton(button, isOn) {
        button.setAttribute("data-source-power", isOn ? "on" : "off");
        button.textContent = isOn ? "Éteindre" : "Allumer";
        button.classList.toggle("primary", isOn);
      }

      document.querySelectorAll("[data-count]").forEach((btn) => {
        btn.addEventListener("click", () => {
          window.liveHub.setScreenCount(Number(btn.getAttribute("data-count")));
        });
      });

      document.querySelectorAll("[data-source-id]").forEach((btn) => {
        updatePowerButton(btn, true);
        btn.addEventListener("click", () => {
          const currentlyOn = btn.getAttribute("data-source-power") === "on";
          const nextState = !currentlyOn;
          window.liveHub.setSourcePower(btn.getAttribute("data-source-id"), nextState);
          updatePowerButton(btn, nextState);
        });
      });

      document.querySelectorAll("[data-slot-source]").forEach((select) => {
        select.addEventListener("change", (event) => {
          const slotIndex = Number(event.currentTarget.getAttribute("data-slot-source"));
          window.liveHub.setSlotSource(slotIndex, event.currentTarget.value);
        });
      });

      document.querySelectorAll("[data-slot-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slotIndex = Number(btn.getAttribute("data-slot-index"));
          const mode = btn.getAttribute("data-slot-mode");
          window.liveHub.setSlotMode(slotIndex, mode);
        });
      });

      const chatToggle = document.querySelector("[data-chat-toggle]");
      let chatOn = true;
      chatToggle.addEventListener("click", () => {
        chatOn = !chatOn;
        window.liveHub.setChatVisible(chatOn);
        chatToggle.textContent = chatOn ? "Chat ON" : "Chat OFF";
        chatToggle.classList.toggle("primary", chatOn);
      });

      document.querySelector("[data-chat-mode]").addEventListener("change", (event) => {
        window.liveHub.setChatMode(event.currentTarget.value);
      });

      document.querySelector("[data-action='toggle-fullscreen']").addEventListener("click", () => {
        window.liveHub.toggleFullScreen();
      });
    </script>
  </body>
</html>
